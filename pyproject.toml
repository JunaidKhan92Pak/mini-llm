[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-llm"
version = "0.1.0"
description = "JeePeeTee: an educational, from-scratch GPT-style language model in PyTorch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4,<5",
    "numpy>=2,<3",
    "tokenizers>=0.22,<1",
    "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
